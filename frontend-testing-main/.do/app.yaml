name: market-mono-app
region: nyc

services:
  # Backend Service
  - name: backend
    source_dir: /backend
    github:
      repo: your-username/your-repo-name
      branch: main
    run_command: npm start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    routes:
      - path: /api
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
    # Add your environment variables here

  # Frontend Service
  - name: frontend
    source_dir: /
    github:
      repo: your-username/your-repo-name
      branch: main
    build_command: npm install && npm run build
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    routes:
      - path: /
    static_sites:
      - name: frontend-static
        source_dir: /dist
        routes:
          - path: /
        catchall_document: index.html

# Optional: Add a database
