server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL}

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          host: ${HOST_ALIAS}
          role: ${HOST_ROLE}
          __path__: /var/log/*.log

  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          host: ${HOST_ALIAS}
          role: ${HOST_ROLE}
          __path__: /var/log/nginx/*.log

  - job_name: docker
    pipeline_stages:
      - docker: {}
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          host: ${HOST_ALIAS}
          role: ${HOST_ROLE}
          __path__: /var/lib/docker/containers/*/*-json.log

  - job_name: postgres
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgres
          host: ${HOST_ALIAS}
          role: ${HOST_ROLE}
          source: postgresql-file
          __path__: /var/log/postgresql/*.log

  - job_name: pgbackrest
    static_configs:
      - targets:
          - localhost
        labels:
          job: pgbackrest
          host: ${HOST_ALIAS}
          role: ${HOST_ROLE}
          source: pgbackrest-file
          __path__: /var/log/pgbackrest/*.log
