apiVersion: 1

providers:
  - name: MarketMono PostgreSQL
    orgId: 1
    folder: MarketMono Database
    type: file
    disableDeletion: false
    editable: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false

  - name: MarketMono Logs
    orgId: 1
    folder: MarketMono Logs
    type: file
    disableDeletion: false
    editable: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards/logs
      foldersFromFilesStructure: false
