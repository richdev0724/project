apiVersion: 1
groups:
  - orgId: 1
    name: marketmono_core_1m
    folder: MarketMono Alerts
    interval: 1m
    rules:
      - uid: mm_target_down
        title: MarketMono Target Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: efisr3uq9kw00a
            model:
              datasource:
                type: prometheus
                uid: efisr3uq9kw00a
              disableTextWrap: false
              editorMode: code
              expr: up{job=~"prometheus|node-exporter|backend-server|backend-admin|postgres-exporter"}
              fullMetaSearch: false
              includeNullMetadata: true
              instant: false
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: true
              refId: A
              useBackend: false
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: One or more MarketMono scrape targets are down.
          description: A Prometheus target for MarketMono has reported down for at least 5 minutes.
        labels:
          severity: critical
          service: observability
          category: availability
        isPaused: false
      - uid: mm_backend_5xx
        title: MarketMono Backend 5xx Spike
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: efisr3uq9kw00a
            model:
              datasource:
                type: prometheus
                uid: efisr3uq9kw00a
              disableTextWrap: false
              editorMode: code
              expr: 100 * (sum by (host) (rate(http_server_requests_seconds_count{job="backend-server",status=~"5.."}[5m])) / clamp_min(sum by (host) (rate(http_server_requests_seconds_count{job="backend-server"}[5m])), 0.01))
              fullMetaSearch: false
              includeNullMetadata: true
              instant: false
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: true
              refId: A
              useBackend: false
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: Backend 5xx ratio is elevated.
          description: A backend-server host has sustained a 5xx ratio above 2% for 10 minutes.
        labels:
          severity: warning
          service: backend-server
          category: errors
        isPaused: false
