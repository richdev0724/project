                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: Backend p95 latency is above 1 second.
          description: A backend-server host has sustained p95 request latency above 1 second for 10 minutes.
        labels:
          severity: warning
          service: backend-server
          category: latency
        isPaused: false
