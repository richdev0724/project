      - uid: mm_error_log_burst
        title: MarketMono Error Log Burst
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: afisr480c5af4e
            model:
              datasource:
                type: loki
                uid: afisr480c5af4e
              editorMode: code
              expr: sum by (host) (count_over_time({host!~"observability-prod",job=~".+"} |~ "(?i)((^|[[:space:]])(\\x1b[[][0-9;]*m)?(ERROR|FATAL|PANIC)([[:space:]]|\\x1b[[][0-9;]*m|:)|[[](error|crit|alert|emerg)[]]|level=(error|fatal|panic))" |!~ "(?i)(NewsAPI.*429|Marketaux.*402|MarketAux.*402|Received 429 rate limit response|Endpoint returned 422|Invalid refresh token|Refresh token is expired or revoked)" [5m]))
