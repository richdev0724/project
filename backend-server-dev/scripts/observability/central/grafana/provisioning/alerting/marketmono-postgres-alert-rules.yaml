apiVersion: 1
groups:
  - orgId: 1
    name: marketmono_postgres_1m
    folder: MarketMono Alerts
    interval: 1m
    rules:
      - uid: mm_pg_exporter_down
        title: MarketMono PostgreSQL Exporter Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: efisr3uq9kw00a
            model:
              datasource:
                type: prometheus
                uid: efisr3uq9kw00a
              editorMode: code
              expr: up{job="postgres-exporter"}
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: PostgreSQL exporter is down.
          description: A PostgreSQL exporter target has been unreachable for at least 5 minutes.
        labels:
          severity: critical
          service: postgres
          category: availability
        isPaused: false
