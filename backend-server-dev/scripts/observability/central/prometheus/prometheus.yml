global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          host: observability-prod
          role: observability
    relabel_configs:
      - source_labels: [host]
        target_label: instance

  - job_name: node-exporter
    static_configs:
      - targets:
          - 10.130.0.4:9100
        labels:
          host: frontend-edge-prod
          role: edge
      - targets:
          - 10.130.0.5:9100
        labels:
          host: backend-a-prod
          role: backend
      - targets:
          - 10.130.0.6:9100
        labels:
          host: backend-b-prod
          role: backend
      - targets:
          - 10.130.0.7:9100
        labels:
          host: backend-admin-prod
          role: admin
      - targets:
          - 10.130.0.8:9100
        labels:
          host: observability-prod
          role: observability
      - targets:
          - 10.130.0.2:9100
        labels:
          host: pg18-tsdb-a
          role: database-primary
          environment: validation
      - targets:
          - 10.130.0.13:9100
        labels:
          host: pg18-tsdb-b
          role: database-standby
          environment: validation
    relabel_configs:
      - source_labels: [host]
        target_label: instance

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - 10.130.0.2:9187
        labels:
          host: pg18-tsdb-a
          role: database-primary
          environment: validation
      - targets:
          - 10.130.0.13:9187
        labels:
          host: pg18-tsdb-b
          role: database-standby
          environment: validation
    relabel_configs:
      - source_labels: [host]
        target_label: instance

  - job_name: backend-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 10.130.0.5:8080
        labels:
          host: backend-a-prod
          role: backend
      - targets:
          - 10.130.0.6:8080
        labels:
          host: backend-b-prod
          role: backend
    relabel_configs:
      - source_labels: [host]
        target_label: instance

  - job_name: backend-admin
    metrics_path: /admin-api/actuator/prometheus
    static_configs:
      - targets:
          - 10.130.0.7:8081
        labels:
          host: backend-admin-prod
          role: admin
    relabel_configs:
      - source_labels: [host]
        target_label: instance
