# Production Docker Compose — Single Source of Truth for Market Mono
# Deployed to /home/ubuntu/docker-compose-dev.yml on the remote server
# Manages ALL services: nginx, backend, backend-admin, postgres, frontend
#
# DEPLOY RULES:
#   - Each CI/CD pipeline copies this file and recreates ONLY its own service
#   - NEVER kill/remove other containers — use `docker compose up -d --no-deps <service>`
#   - Production services share one long-lived external network to avoid single-service deploys
#     trying to recreate/remove it while other containers are still attached

services:

  nginx:
    image: nginx:alpine
    container_name: marketmono-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  backend:
    image: ghcr.io/market-mono/backend-server:latest
    container_name: marketmono-backend
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      # Production currently uses the approved bridge-IP hotfix via APP_DATABASE_HOST.
      # Fallback remains host.docker.internal for future normalization.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${APP_DATABASE_HOST:-host.docker.internal}:${APP_DATABASE_PORT:-5432}/marketmono
      - SPRING_DATASOURCE_USERNAME=${DATABASE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD}
      # The rebuilt host PG18 database is now owned by the consolidated backend-server Liquibase chain.
      - SPRING_LIQUIBASE_ENABLED=${BACKEND_SPRING_LIQUIBASE_ENABLED:-true}
      - UNUSUAL_WHALES_API_KEY=${UNUSUAL_WHALES_API_KEY}
      - CONGRESS_GOV_API_KEY=${CONGRESS_GOV_API_KEY:-}
      - WHOP_WEBHOOK_SECRET=${WHOP_WEBHOOK_SECRET:-}
      - WHOP_WEBHOOK_SIGNATURE_TOLERANCE=${WHOP_WEBHOOK_SIGNATURE_TOLERANCE:-PT5M}
      - WEBSOCKET_ALLOWED_ORIGIN_PATTERNS=${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:-http://*:*}
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
      - KAFKA_PASSWORD=${KAFKA_PASSWORD:-}
      - KAFKA_USERNAME=${KAFKA_USERNAME:-marketmono}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-stream.unusualwhales.com:9083}
      - JAVA_OPTS=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump.hprof -Xlog:gc*:file=/app/logs/gc.log:time,uptime,level,tags
    volumes:
      - backend-logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "100"
        compress: "true"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G
        reservations:
          memory: 1G

  backend-admin:
    image: ghcr.io/market-mono/backend-admin:latest
    container_name: marketmono-backend-admin
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=${APP_DATABASE_HOST:-host.docker.internal}
      - DB_PORT=${APP_DATABASE_PORT:-5432}
      - DB_NAME=marketmono
      - DB_USERNAME=${DATABASE_USERNAME:-postgres}
      - DB_PASSWORD=${DATABASE_PASSWORD}
      - SPRING_LIQUIBASE_ENABLED=${BACKEND_ADMIN_SPRING_LIQUIBASE_ENABLED:-false}
      - JWT_SECRET=${ADMIN_JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${ADMIN_CORS_ORIGINS:-http://15.204.212.20,http://15.204.212.20:80}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/admin-api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  postgres:
    # Retained during host-PostgreSQL migration rehearsal and rollback.
    # Application containers should no longer depend on this service for startup.
    image: timescale/timescaledb:latest-pg18
    container_name: marketmono-postgres
    environment:
      - POSTGRES_DB=marketmono
      - POSTGRES_USER=${DATABASE_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres-logs:/var/log/postgresql
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d marketmono"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          memory: 1G

  frontend:
    build:
      context: /home/ubuntu/frontend-testing
      dockerfile: Dockerfile
    container_name: marketmono-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://15.204.212.20/api/v1
      - NEXT_PUBLIC_WS_URL=ws://15.204.212.20/ws
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data:
    driver: local
  postgres-logs:
    driver: local
  backend-logs:
    driver: local

networks:
  app-network:
    external: true
    name: ubuntu_app-network
