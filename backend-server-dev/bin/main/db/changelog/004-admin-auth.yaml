databaseChangeLog:
  - changeSet:
      id: baseline-004-admin-auth
      author: marketmono
      validCheckSum:
        - '9:0ff84153d68b46cb3b173cbbbdc06297'
      comment: Create the consolidated final admin authentication schema.
      changes:
        - sql:
            splitStatements: false
            dbms: postgresql
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'admin_role') THEN
                  CREATE TYPE admin_role AS ENUM ('SUPER_ADMIN', 'ADMIN', 'SUPPORT', 'BILLING_ADMIN');
                END IF;
              END
              $$;

        - createTable:
            tableName: admin_users
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email_lowercase
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: VARCHAR(100)
              - column:
                  name: first_name
                  type: VARCHAR(100)
              - column:
                  name: last_name
                  type: VARCHAR(100)
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: email_verified
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: two_factor_enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: two_factor_secret
                  type: VARCHAR(255)
              - column:
                  name: requires_password_change
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: password_changed_at
                  type: TIMESTAMP
              - column:
                  name: temp_password_expires_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_login_at
                  type: TIMESTAMP
              - column:
                  name: last_login_ip
                  type: VARCHAR(45)
              - column:
                  name: failed_login_attempts
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: locked_until
                  type: TIMESTAMP
              - column:
                  name: deleted_at
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: UUID
        - createIndex:
            indexName: idx_admin_users_email
            tableName: admin_users
            columns:
              - column:
                  name: email
        - createIndex:
            indexName: idx_admin_users_email_lowercase
            tableName: admin_users
            columns:
              - column:
                  name: email_lowercase
        - createIndex:
            indexName: idx_admin_users_deleted_at
            tableName: admin_users
            columns:
              - column:
                  name: deleted_at

        - createTable:
            tableName: admin_roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: admin_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: admin_role
                  constraints:
                    nullable: false
              - column:
                  name: granted_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_admin_roles_admin_user_id
            tableName: admin_roles
            columns:
              - column:
                  name: admin_user_id
        - createIndex:
            indexName: idx_admin_roles_unique
            tableName: admin_roles
            unique: true
            columns:
              - column:
                  name: admin_user_id
              - column:
                  name: role
        - addForeignKeyConstraint:
            baseTableName: admin_roles
            baseColumnNames: admin_user_id
            constraintName: fk_admin_roles_admin_user_id
            referencedTableName: admin_users
            referencedColumnNames: id
            onDelete: CASCADE

        - createTable:
            tableName: admin_refresh_tokens
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: admin_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: token
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: revoked
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: user_agent
                  type: VARCHAR(500)
              - column:
                  name: ip_address
                  type: VARCHAR(45)
        - createIndex:
            indexName: idx_admin_refresh_tokens_token
            tableName: admin_refresh_tokens
            columns:
              - column:
                  name: token
        - createIndex:
            indexName: idx_admin_refresh_tokens_admin_user_id
            tableName: admin_refresh_tokens
            columns:
              - column:
                  name: admin_user_id
        - addForeignKeyConstraint:
            baseTableName: admin_refresh_tokens
            baseColumnNames: admin_user_id
            constraintName: fk_admin_refresh_tokens_admin_user_id
            referencedTableName: admin_users
            referencedColumnNames: id
            onDelete: CASCADE

        - createTable:
            tableName: admin_audit_log
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: admin_user_id
                  type: UUID
              - column:
                  name: action
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: resource_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: resource_id
                  type: VARCHAR(255)
              - column:
                  name: details
                  type: JSONB
              - column:
                  name: ip_address
                  type: VARCHAR(45)
              - column:
                  name: user_agent
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addNotNullConstraint:
            tableName: admin_audit_log
            columnName: admin_user_id
            columnDataType: UUID
        - addNotNullConstraint:
            tableName: admin_audit_log
            columnName: created_at
            columnDataType: TIMESTAMP
        - createIndex:
            indexName: idx_admin_audit_log_admin_user_id
            tableName: admin_audit_log
            columns:
              - column:
                  name: admin_user_id
        - createIndex:
            indexName: idx_admin_audit_log_created_at
            tableName: admin_audit_log
            columns:
              - column:
                  name: created_at
        - createIndex:
            indexName: idx_admin_audit_log_action
            tableName: admin_audit_log
            columns:
              - column:
                  name: action
        - addForeignKeyConstraint:
            baseTableName: admin_audit_log
            baseColumnNames: admin_user_id
            constraintName: fk_admin_audit_log_admin_user_id
            referencedTableName: admin_users
            referencedColumnNames: id
            onDelete: SET NULL

