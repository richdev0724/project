databaseChangeLog:
  - changeSet:
      id: timescale-010-enable-extension
      author: marketmono
      comment: Enable the TimescaleDB extension on the rebuilt host PostgreSQL instance.
      changes:
        - sql:
            dbms: postgresql
            sql: CREATE EXTENSION IF NOT EXISTS timescaledb;

  - changeSet:
      id: timescale-011-convert-and-policy-market-data
      author: marketmono
      comment: >-
        Convert the rebuildable market-data tables to hypertables and apply the
        consolidated policy set. Verification 2026-03-14: sector_etf_prices
        intentionally remains a regular table because the live migration history
        never converted it to a hypertable.
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            dbms: postgresql
            sql: |
              -- Verification 2026-03-14: this Timescale layer intentionally covers only
              -- flow_alerts, dp_lp_trades, dp_lp_aggregates, and option_trades.
              -- sector_etf_prices remains a regular table for schema parity.
              SELECT create_hypertable('flow_alerts', 'trade_start_time',
                chunk_time_interval => INTERVAL '7 days',
                migrate_data => true,
                if_not_exists => true
              );

              ALTER TABLE flow_alerts SET (
                timescaledb.compress,
                timescaledb.compress_segmentby = 'ticker',
                timescaledb.compress_orderby = 'trade_start_time DESC'
              );
              SELECT add_compression_policy('flow_alerts', INTERVAL '2 hours', if_not_exists => true);
              SELECT add_retention_policy('flow_alerts', INTERVAL '365 days', if_not_exists => true);

              SELECT create_hypertable('dp_lp_trades', 'ts',
                chunk_time_interval => INTERVAL '7 days',
                migrate_data => true,
                if_not_exists => true
              );

              ALTER TABLE dp_lp_trades SET (
                timescaledb.compress,
                timescaledb.compress_segmentby = 'ticker, venue_type',
                timescaledb.compress_orderby = 'ts DESC'
              );
              SELECT add_compression_policy('dp_lp_trades', INTERVAL '2 hours', if_not_exists => true);
              SELECT add_retention_policy('dp_lp_trades', INTERVAL '90 days', if_not_exists => true);

              SELECT create_hypertable('dp_lp_aggregates', 'bucket_start',
                chunk_time_interval => INTERVAL '7 days',
                migrate_data => true,
                if_not_exists => true
              );

              ALTER TABLE dp_lp_aggregates SET (
                timescaledb.compress,
                timescaledb.compress_segmentby = 'ticker',
                timescaledb.compress_orderby = 'bucket_start DESC'
              );
              SELECT add_compression_policy('dp_lp_aggregates', INTERVAL '30 days', if_not_exists => true);
              SELECT add_retention_policy('dp_lp_aggregates', INTERVAL '730 days', if_not_exists => true);

              SELECT create_hypertable('option_trades', 'executed_at',
                chunk_time_interval => INTERVAL '1 day',
                migrate_data => true,
                if_not_exists => true
              );

              ALTER TABLE option_trades SET (
                timescaledb.compress,
                timescaledb.compress_segmentby = 'ticker',
                timescaledb.compress_orderby = 'executed_at DESC'
              );
              SELECT add_compression_policy('option_trades', INTERVAL '2 hours', if_not_exists => true);
              SELECT add_retention_policy('option_trades', INTERVAL '90 days', if_not_exists => true);
