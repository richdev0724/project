              - column:
                  name: subject
                  value: "Action Required: Payment Failed"
              - column:
                  name: body_html
                  value: |
                    <!DOCTYPE html>
                    <html>
                    <head>
                      <meta charset="utf-8">
                      <style>
                        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
