                      <div class="container">
                        <div class="header">
                          <h1>Payment Failed</h1>
                        </div>
                        <div class="content">
                          <p>Hi {{user.firstName}},</p>
                          <div class="alert">
                            <strong>Your payment of {{payment.amount}} for {{subscription.planName}} was unsuccessful.</strong>
                            <p>Reason: {{payment.failureReason}}</p>
                          </div>
                          <p>To avoid service interruption, please update your payment method:</p>
