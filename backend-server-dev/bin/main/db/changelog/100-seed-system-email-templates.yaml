              - column:
                  name: subject
                  value: "Payment Receipt - {{invoice.number}}"
              - column:
                  name: body_html
                  value: |
                    <!DOCTYPE html>
                    <html>
                    <head>
                      <meta charset="utf-8">
                      <style>
                        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
                        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
                        .header { background: #1a1a2e; color: white; padding: 20px; text-align: center; }
                        .content { padding: 20px; background: #f9f9f9; }
                        .footer { padding: 20px; text-align: center; font-size: 12px; color: #666; }
                        .receipt { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin: 20px 0; }
                        .receipt-header { border-bottom: 1px solid #e5e7eb; padding-bottom: 15px; margin-bottom: 15px; }
                        .receipt-row { display: flex; justify-content: space-between; padding: 8px 0; }
                        .receipt-total { border-top: 2px solid #1a1a2e; padding-top: 15px; margin-top: 15px; font-weight: bold; font-size: 18px; }
                        .success { color: #10b981; }
                      </style>
                    </head>
                    <body>
                      <div class="container">
                        <div class="header">
                          <h1>Payment Receipt</h1>
                        </div>
                        <div class="content">
                          <p>Hi {{user.firstName}},</p>
                          <p class="success">✓ Payment successful!</p>
                          <div class="receipt">
                            <div class="receipt-header">
                              <strong>Invoice #{{invoice.number}}</strong><br>
                              Date: {{invoice.date}}
                            </div>
                            <div class="receipt-row">
                              <span>{{subscription.planName}} ({{subscription.interval}})</span>
                              <span>{{invoice.amount}}</span>
                            </div>
                            <div class="receipt-total">
                              <div class="receipt-row">
                                <span>Total Paid</span>
                                <span>{{invoice.amount}}</span>
                              </div>
                            </div>
                          </div>
                          <p>Payment method: {{payment.method}} ending in {{payment.last4}}</p>
                          <p><a href="{{invoice.downloadUrl}}">Download PDF Receipt</a></p>
                        </div>
                        <div class="footer">
                          <p>&copy; {{app.year}} MarketMono. All rights reserved.</p>
                        </div>
                      </div>
                    </body>
                    </html>
              - column:
