databaseChangeLog:
  - changeSet:
      id: seed-100-system-email-templates
      author: marketmono
      comment: Seed the default system email templates used by user and billing workflows.
      changes:
        - insert:
            tableName: email_templates
            columns:
              - column:
                  name: slug
                  value: welcome-registration
              - column:
                  name: name
                  value: Welcome Email
              - column:
                  name: subject
                  value: "Welcome to MarketMono, {{user.firstName}}!"
              - column:
                  name: body_html
                  value: |
                    <!DOCTYPE html>
                    <html>
                    <head>
                      <meta charset="utf-8">
                      <style>
                        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
                        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
                        .header { background: #1a1a2e; color: white; padding: 20px; text-align: center; }
                        .content { padding: 20px; background: #f9f9f9; }
                        .button { display: inline-block; background: #4f46e5; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; margin: 20px 0; }
                        .footer { padding: 20px; text-align: center; font-size: 12px; color: #666; }
                      </style>
                    </head>
                    <body>
                      <div class="container">
                        <div class="header">
                          <h1>Welcome to MarketMono</h1>
                        </div>
                        <div class="content">
                          <p>Hi {{user.firstName}},</p>
                          <p>Thank you for joining MarketMono! We're excited to have you on board.</p>
                          <p>With your new account, you can:</p>
                          <ul>
                            <li>Track real-time options flow alerts</li>
                            <li>Analyze dark pool activity</li>
                            <li>Access market data and analytics</li>
                          </ul>
                          <p>Get started by exploring your dashboard:</p>
                          <a href="{{app.dashboardUrl}}" class="button">Go to Dashboard</a>
                        </div>
                        <div class="footer">
                          <p>If you have any questions, contact us at {{app.supportEmail}}</p>
                          <p>&copy; {{app.year}} MarketMono. All rights reserved.</p>
                        </div>
                      </div>
                    </body>
                    </html>
              - column:
                  name: body_text
                  value: |
                    Welcome to MarketMono, {{user.firstName}}!

                    Thank you for joining MarketMono! We're excited to have you on board.

                    With your new account, you can:
                    - Track real-time options flow alerts
                    - Analyze dark pool activity
                    - Access market data and analytics

                    Get started by visiting your dashboard: {{app.dashboardUrl}}

                    If you have any questions, contact us at {{app.supportEmail}}

                    © {{app.year}} MarketMono. All rights reserved.
              - column:
                  name: variables
                  value: '[{"key":"user.firstName","description":"User''s first name","example":"John"},{"key":"user.email","description":"User''s email address","example":"john@example.com"},{"key":"app.dashboardUrl","description":"Dashboard URL","example":"https://app.marketmono.com/dashboard"},{"key":"app.supportEmail","description":"Support email address","example":"support@marketmono.com"},{"key":"app.year","description":"Current year","example":"2025"}]'
              - column:
                  name: category
                  value: TRANSACTIONAL
              - column:
                  name: is_active
                  valueBoolean: true
              - column:
                  name: is_system
                  valueBoolean: true
              - column:
                  name: version
                  valueNumeric: 1

        - insert:
            tableName: email_templates
            columns:
              - column:
                  name: slug
                  value: email-verification
              - column:
                  name: name
                  value: Email Verification
              - column:
                  name: subject
                  value: "Verify your email address"
              - column:
                  name: body_html
                  value: |
                    <!DOCTYPE html>
                    <html>
                    <head>
                      <meta charset="utf-8">
                      <style>
                        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
                        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
                        .header { background: #1a1a2e; color: white; padding: 20px; text-align: center; }
                        .content { padding: 20px; background: #f9f9f9; }
                        .button { display: inline-block; background: #4f46e5; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; margin: 20px 0; }
                        .footer { padding: 20px; text-align: center; font-size: 12px; color: #666; }
                        .code { background: #e5e7eb; padding: 10px 20px; font-size: 24px; font-weight: bold; letter-spacing: 4px; display: inline-block; margin: 10px 0; }
                      </style>
                    </head>
                    <body>
                      <div class="container">
                        <div class="header">
                          <h1>Verify Your Email</h1>
                        </div>
                        <div class="content">
                          <p>Hi {{user.firstName}},</p>
                          <p>Please verify your email address by clicking the button below:</p>
                          <a href="{{verification.url}}" class="button">Verify Email</a>
                          <p>Or use this verification code:</p>
                          <div class="code">{{verification.code}}</div>
                          <p><small>This link expires in {{verification.expiryHours}} hours.</small></p>
                          <p>If you didn't create an account, please ignore this email.</p>
                        </div>
                        <div class="footer">
                          <p>&copy; {{app.year}} MarketMono. All rights reserved.</p>
                        </div>
                      </div>
                    </body>
                    </html>
              - column:
                  name: body_text
                  value: |
                    Verify Your Email

                    Hi {{user.firstName}},

                    Please verify your email address by clicking the link below:
                    {{verification.url}}

                    Or use this verification code: {{verification.code}}

                    This link expires in {{verification.expiryHours}} hours.

                    If you didn't create an account, please ignore this email.

                    © {{app.year}} MarketMono. All rights reserved.
              - column:
                  name: variables
                  value: '[{"key":"user.firstName","description":"User''s first name","example":"John"},{"key":"verification.url","description":"Verification link URL","example":"https://app.marketmono.com/verify?token=abc123"},{"key":"verification.code","description":"Verification code","example":"123456"},{"key":"verification.expiryHours","description":"Hours until link expires","example":"48"},{"key":"app.year","description":"Current year","example":"2025"}]'
              - column:
                  name: category
                  value: TRANSACTIONAL
              - column:
                  name: is_active
                  valueBoolean: true
              - column:
                  name: is_system
                  valueBoolean: true
              - column:
                  name: version
                  valueNumeric: 1

        - insert:
            tableName: email_templates
            columns:
              - column:
                  name: slug
                  value: password-reset
              - column:
                  name: name
                  value: Password Reset
              - column:
                  name: subject
                  value: "Reset your password"
              - column:
                  name: body_html
                  value: |
                    <!DOCTYPE html>
                    <html>
                    <head>
                      <meta charset="utf-8">
                      <style>
                        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
                        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
                        .header { background: #1a1a2e; color: white; padding: 20px; text-align: center; }
                        .content { padding: 20px; background: #f9f9f9; }
                        .button { display: inline-block; background: #4f46e5; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; margin: 20px 0; }
                        .footer { padding: 20px; text-align: center; font-size: 12px; color: #666; }
