                      <div class="container">
                        <div class="header">
                          <h1>Reset Your Password</h1>
                        </div>
                        <div class="content">
                          <p>Hi {{user.firstName}},</p>
                          <p>We received a request to reset your password. Click the button below to create a new password:</p>
                          <a href="{{reset.url}}" class="button">Reset Password</a>
                          <p><small>This link expires in {{reset.expiryMinutes}} minutes.</small></p>
                          <div class="warning">
                            <strong>Security Notice:</strong> If you didn't request this password reset, please ignore this email or contact support if you're concerned about your account security.
                          </div>
