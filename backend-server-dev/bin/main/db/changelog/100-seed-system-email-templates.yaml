                  name: variables
                  value: '[{"key":"user.firstName","description":"User''s first name","example":"John"},{"key":"subscription.planName","description":"Subscription plan name","example":"Pro"},{"key":"subscription.amount","description":"Formatted price with currency","example":"$49.99"},{"key":"subscription.interval","description":"Billing interval","example":"month"},{"key":"subscription.nextBillingDate","description":"Next billing date","example":"January 15, 2025"},{"key":"app.dashboardUrl","description":"Dashboard URL","example":"https://app.marketmono.com/dashboard"},{"key":"app.year","description":"Current year","example":"2025"}]'
