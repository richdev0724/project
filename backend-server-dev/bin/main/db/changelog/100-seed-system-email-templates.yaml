              - column:
                  name: is_active
                  valueBoolean: true
              - column:
                  name: is_system
                  valueBoolean: true
              - column:
                  name: version
                  valueNumeric: 1

        - insert:
            tableName: email_templates
            columns:
              - column:
                  name: slug
                  value: subscription-confirmation
              - column:
                  name: name
                  value: Subscription Confirmation
              - column:
                  name: subject
                  value: "Welcome to {{subscription.planName}} - Subscription Confirmed"
              - column:
                  name: body_html
                  value: |
                    <!DOCTYPE html>
                    <html>
                    <head>
                      <meta charset="utf-8">
                      <style>
                        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
                        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
                        .header { background: #1a1a2e; color: white; padding: 20px; text-align: center; }
                        .content { padding: 20px; background: #f9f9f9; }
                        .button { display: inline-block; background: #4f46e5; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; margin: 20px 0; }
                        .footer { padding: 20px; text-align: center; font-size: 12px; color: #666; }
                        .plan-box { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin: 20px 0; }
                        .plan-name { font-size: 24px; font-weight: bold; color: #4f46e5; }
                        .plan-price { font-size: 18px; color: #666; }
                      </style>
                    </head>
                    <body>
                      <div class="container">
                        <div class="header">
                          <h1>Subscription Confirmed!</h1>
                        </div>
                        <div class="content">
                          <p>Hi {{user.firstName}},</p>
                          <p>Thank you for subscribing to MarketMono!</p>
                          <div class="plan-box">
                            <div class="plan-name">{{subscription.planName}} Plan</div>
                            <div class="plan-price">{{subscription.amount}} / {{subscription.interval}}</div>
                            <p>Next billing date: {{subscription.nextBillingDate}}</p>
                          </div>
                          <p>You now have access to all {{subscription.planName}} features. Start exploring:</p>
                          <a href="{{app.dashboardUrl}}" class="button">Go to Dashboard</a>
                          <p>Manage your subscription anytime from your account settings.</p>
                        </div>
                        <div class="footer">
                          <p>&copy; {{app.year}} MarketMono. All rights reserved.</p>
                        </div>
                      </div>
                    </body>
                    </html>
              - column:
                  name: body_text
                  value: |
                    Subscription Confirmed!

                    Hi {{user.firstName}},

                    Thank you for subscribing to MarketMono!

                    Plan: {{subscription.planName}}
                    Price: {{subscription.amount}} / {{subscription.interval}}
