syntax = "proto3";

option java_package = "com.marketmono.proto.client";
option java_outer_classname = "IssueTypeProto";

enum IssueType {
    Adr = 0;
    CommonStock = 1;
    Etf = 2;
    Other = 3;
    PreferredStock = 4;
    Right = 5;
    StructuredProduct = 6;
    Unit = 7;
    Warrant = 8;
    Index = 9;
}
