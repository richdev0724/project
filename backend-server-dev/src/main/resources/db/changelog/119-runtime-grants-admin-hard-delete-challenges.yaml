databaseChangeLog:
  - logicalFilePath: db/changelog/119-runtime-grants-admin-hard-delete-challenges.yaml

  - changeSet:
      id: 119-runtime-grants-admin-hard-delete-challenges
      author: marketmono
      comment: Grant the runtime app role access to admin hard-delete challenge records.
      dbms: postgresql
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'marketmono_app')
                     AND to_regclass('public.admin_hard_delete_challenges') IS NOT NULL THEN
                      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.admin_hard_delete_challenges TO marketmono_app;
                  END IF;
              END
              $$;
      rollback:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'marketmono_app')
                     AND to_regclass('public.admin_hard_delete_challenges') IS NOT NULL THEN
                      REVOKE SELECT, INSERT, UPDATE, DELETE ON TABLE public.admin_hard_delete_challenges FROM marketmono_app;
                  END IF;
              END
              $$;
