databaseChangeLog:
  - changeSet:
      id: 108-seed-economic-events-from-temporary-json
      author: marketmono
      comment: Seed economic_events from the temporary packaged JSON source before removing JSON runtime usage.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
