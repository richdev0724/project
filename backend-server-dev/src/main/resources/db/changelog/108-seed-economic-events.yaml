                event,
                event_time,
                type,
                priority,
                cache_date,
                forecast,
                prev,
                reported_period,
                cached_at,
                created_at
              )
              SELECT
                seed.event,
                seed.event_time,
                seed.type::economic_event_type,
                seed.priority::economic_event_priority,
                seed.cache_date::date,
                seed.forecast,
