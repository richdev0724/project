databaseChangeLog:
  - logicalFilePath: src/main/resources/db/changelog/105-changelog-entries.yaml
  - changeSet:
      id: changelog-105-create-table
      author: marketmono
      comment: Create changelog_entries table for Help-page changelog content managed from the admin panel.
      changes:
        - createTable:
            tableName: changelog_entries
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: release_version
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: release_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: entry_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: entry_text
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: sort_order
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: visibility
                  type: VARCHAR(20)
                  defaultValue: VISIBLE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_changelog_entries_release_date
            tableName: changelog_entries
            columns:
              - column:
                  name: release_date
        - createIndex:
            indexName: idx_changelog_entries_visibility_release_sort
            tableName: changelog_entries
            columns:
              - column:
                  name: visibility
              - column:
                  name: release_date
              - column:
                  name: sort_order

  - changeSet:
      id: changelog-105-seed-existing-help-page-data
      author: marketmono
      comment: Seed existing Help-page changelog entries into the new managed changelog table.
      changes:
        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO changelog_entries (
