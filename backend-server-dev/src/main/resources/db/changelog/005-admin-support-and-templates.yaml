databaseChangeLog:
  - logicalFilePath: src/main/resources/db/changelog/005-admin-support-and-templates.yaml
  - changeSet:
      id: baseline-005-admin-support-types
      author: marketmono
      comment: Create the remaining enum used by admin support tables.
      changes:
        - sql:
            splitStatements: false
            dbms: postgresql
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'email_template_category') THEN
                  CREATE TYPE email_template_category AS ENUM ('TRANSACTIONAL', 'MARKETING');
                END IF;
              END
              $$;

  - changeSet:
      id: baseline-005-admin-support-and-templates
      author: marketmono
      comment: Create admin recovery/activity support tables and the shared email template catalog.
      changes:
        - createTable:
            tableName: admin_recovery_codes
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: admin_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: code_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: used
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_admin_recovery_codes_admin_user_id
            tableName: admin_recovery_codes
            columns:
              - column:
                  name: admin_user_id
        - createIndex:
            indexName: idx_admin_recovery_codes_used
            tableName: admin_recovery_codes
            columns:
              - column:
                  name: admin_user_id
              - column:
                  name: used
        - addForeignKeyConstraint:
            baseTableName: admin_recovery_codes
            baseColumnNames: admin_user_id
            constraintName: fk_admin_recovery_codes_admin_user_id
            referencedTableName: admin_users
            referencedColumnNames: id
            onDelete: CASCADE

        - createTable:
            tableName: admin_activity_logs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: admin_id
                  type: UUID
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: event_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: success
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: details
                  type: VARCHAR(500)
              - column:
                  name: ip_address
                  type: VARCHAR(45)
              - column:
                  name: user_agent
                  type: VARCHAR(500)
              - column:
                  name: session_id
                  type: VARCHAR(100)
              - column:
                  name: location
                  type: VARCHAR(255)
              - column:
                  name: target_id
                  type: BIGINT
              - column:
                  name: target_type
                  type: VARCHAR(50)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_activity_admin_id
            tableName: admin_activity_logs
            columns:
              - column:
                  name: admin_id
        - createIndex:
            indexName: idx_activity_event_type
            tableName: admin_activity_logs
            columns:
              - column:
                  name: event_type
        - createIndex:
            indexName: idx_activity_created_at
            tableName: admin_activity_logs
            columns:
              - column:
                  name: created_at
                  descending: true
        - createIndex:
            indexName: idx_activity_ip_address
            tableName: admin_activity_logs
            columns:
              - column:
                  name: ip_address
        - createIndex:
            indexName: idx_activity_email
            tableName: admin_activity_logs
            columns:
              - column:
                  name: email
        - createIndex:
            indexName: idx_activity_admin_created
            tableName: admin_activity_logs
            columns:
              - column:
                  name: admin_id
              - column:
                  name: created_at
                  descending: true
        - addForeignKeyConstraint:
            baseTableName: admin_activity_logs
            baseColumnNames: admin_id
            constraintName: fk_activity_admin
            referencedTableName: admin_users
            referencedColumnNames: id

        - createTable:
            tableName: email_templates
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: subject
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: body_html
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: body_text
                  type: TEXT
              - column:
                  name: variables
                  type: JSONB
                  defaultValue: '[]'
              - column:
                  name: category
                  type: email_template_category
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: is_system
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: INTEGER
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: email_templates
            indexName: idx_email_templates_category
            columns:
              - column:
                  name: category
        - createIndex:
            tableName: email_templates
            indexName: idx_email_templates_is_active
            columns:
              - column:
                  name: is_active
        - createIndex:
            tableName: email_templates
            indexName: idx_email_templates_category_active
            columns:
              - column:
                  name: category
              - column:
                  name: is_active
