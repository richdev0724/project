databaseChangeLog:
  - changeSet:
      id: 017-subscriber-cap-and-launch-labels
      author: marketmono
      comment: Add launch Partner/Beta labels, subscriber cap settings, and checkout cap reservations.
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: is_partner_user
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: is_beta_user
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_users_is_partner_user
            tableName: users
            columns:
              - column:
                  name: is_partner_user
        - createIndex:
            indexName: idx_users_is_beta_user
            tableName: users
            columns:
              - column:
                  name: is_beta_user
        - createTable:
            tableName: subscriber_cap_reservations
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: price_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: stripe_mode
                  type: stripe_mode
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: stripe_checkout_session_id
                  type: VARCHAR(255)
              - column:
                  name: stripe_subscription_id
                  type: VARCHAR(255)
              - column:
                  name: policy_limit
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: TIMESTAMP
              - column:
                  name: released_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: subscriber_cap_reservations
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_subscriber_cap_reservations_user
            onDelete: CASCADE
        - createIndex:
            indexName: idx_subscriber_cap_reservations_user_id
            tableName: subscriber_cap_reservations
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_subscriber_cap_reservations_status_expires
            tableName: subscriber_cap_reservations
            columns:
              - column:
                  name: status
              - column:
                  name: expires_at
        - createIndex:
            indexName: idx_subscriber_cap_reservations_stripe_session
            tableName: subscriber_cap_reservations
            columns:
              - column:
                  name: stripe_checkout_session_id
        - createIndex:
            indexName: idx_subscriber_cap_reservations_stripe_subscription
            tableName: subscriber_cap_reservations
            columns:
              - column:
                  name: stripe_subscription_id
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO stripe_config (id, name, value, created_at, updated_at)
              VALUES
                (gen_random_uuid(), 'subscriber_cap_enabled', 'false', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                (gen_random_uuid(), 'subscriber_cap_limit', '100', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)
              ON CONFLICT (name) DO NOTHING;
