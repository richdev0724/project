databaseChangeLog:
  - changeSet:
      id: dashboard-ohlc-snapshots-137-table
      author: marketmono
      comment: >-
        Store one OHLC series snapshot per (ticker, timeframe) for the Market
        Overview and Magnificent Seven dashboard charts. Each snapshot holds
        the full chart-ready series returned by a single Unusual Whales OHLC
        call (e.g. /stock/SPY/ohlc/1m?timeframe=1D) and is replaced in place
        every minute during market hours. Snapshots older than the retention
        window (default 4 days) are purged.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TABLE IF NOT EXISTS dashboard_ohlc_snapshots (
                  id                       BIGSERIAL      PRIMARY KEY,
                  ticker                   VARCHAR(10)    NOT NULL,
                  timeframe                VARCHAR(8)     NOT NULL,
                  previous_session_close   DECIMAL(18,6),
                  series                   JSONB          NOT NULL,
                  fetched_at               TIMESTAMPTZ    NOT NULL,
                  created_at               TIMESTAMPTZ    NOT NULL DEFAULT NOW(),
                  updated_at               TIMESTAMPTZ    NOT NULL DEFAULT NOW(),
                  CONSTRAINT uq_dashboard_ohlc_snapshots_ticker_timeframe UNIQUE (ticker, timeframe)
              );

              DO $$
              BEGIN
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'marketmono_app') THEN
                  GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.dashboard_ohlc_snapshots TO marketmono_app;
                  GRANT USAGE, SELECT ON SEQUENCE public.dashboard_ohlc_snapshots_id_seq TO marketmono_app;
                END IF;
              END
              $$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS dashboard_ohlc_snapshots;
