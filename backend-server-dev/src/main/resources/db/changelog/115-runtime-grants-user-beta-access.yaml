databaseChangeLog:
  - logicalFilePath: db/changelog/115-runtime-grants-user-beta-access.yaml

  - changeSet:
      id: 115-runtime-grants-user-beta-access
      author: marketmono
      comment: Grant the runtime app role access to beta waitlist access records.
      dbms: postgresql
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'marketmono_app')
                     AND to_regclass('public.user_beta_access') IS NOT NULL THEN
                      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.user_beta_access TO marketmono_app;
                  END IF;
              END
              $$;
      rollback:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'marketmono_app')
                     AND to_regclass('public.user_beta_access') IS NOT NULL THEN
                      REVOKE SELECT, INSERT, UPDATE, DELETE ON TABLE public.user_beta_access FROM marketmono_app;
                  END IF;
              END
              $$;
