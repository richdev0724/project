databaseChangeLog:
  - changeSet:
      id: crm-price-stream-143-tables
      author: marketmono
      comment: >-
        Live price storage for tickers saved in CRM filters. crm_price_snapshots
        keeps the latest Unusual Whales price:<TICKER> websocket tick per ticker
        (upserted on a short flush interval). crm_price_baselines keeps one
        stock-state snapshot per ticker per trading day, collected at 9:30 AM ET
        Monday-Friday, used as the prev-close baseline for % gain/loss against
        the live websocket price. SPX/SPXW/VIX/VIXW are excluded and keep the
        existing REST pipeline.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TABLE IF NOT EXISTS crm_price_snapshots (
                  id           BIGSERIAL      PRIMARY KEY,
                  ticker       VARCHAR(10)    NOT NULL,
                  close        DECIMAL(18,6)  NOT NULL,
                  tick_time    TIMESTAMPTZ    NOT NULL,
                  volume       BIGINT,
                  created_at   TIMESTAMPTZ    NOT NULL DEFAULT NOW(),
                  updated_at   TIMESTAMPTZ    NOT NULL DEFAULT NOW(),
                  CONSTRAINT uq_crm_price_snapshots_ticker UNIQUE (ticker)
              );

              CREATE TABLE IF NOT EXISTS crm_price_baselines (
                  id             BIGSERIAL      PRIMARY KEY,
                  ticker         VARCHAR(10)    NOT NULL,
                  snapshot_date  DATE           NOT NULL,
                  close          DECIMAL(18,6),
                  prev_close     DECIMAL(18,6),
                  open           DECIMAL(18,6),
                  high           DECIMAL(18,6),
                  low            DECIMAL(18,6),
                  volume         BIGINT,
                  total_volume   BIGINT,
                  tape_time      VARCHAR(40),
                  market_time    VARCHAR(20),
                  fetched_at     TIMESTAMPTZ    NOT NULL,
                  created_at     TIMESTAMPTZ    NOT NULL DEFAULT NOW(),
                  updated_at     TIMESTAMPTZ    NOT NULL DEFAULT NOW(),
                  CONSTRAINT uq_crm_price_baselines_ticker_date UNIQUE (ticker, snapshot_date)
              );

              DO $$
              BEGIN
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'marketmono_app') THEN
                  GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.crm_price_snapshots TO marketmono_app;
                  GRANT USAGE, SELECT ON SEQUENCE public.crm_price_snapshots_id_seq TO marketmono_app;
                  GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.crm_price_baselines TO marketmono_app;
                  GRANT USAGE, SELECT ON SEQUENCE public.crm_price_baselines_id_seq TO marketmono_app;
                END IF;
              END
              $$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS crm_price_snapshots;
              DROP TABLE IF EXISTS crm_price_baselines;
