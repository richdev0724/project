databaseChangeLog:
  - logicalFilePath: src/main/resources/db/changelog/006-option-flow-and-bookmarks.yaml
  - changeSet:
      id: baseline-006-market-data-types
      author: marketmono
      comment: Create enums used by dark-pool and aggregate market-data tables.
      changes:
        - sql:
            splitStatements: false
            dbms: postgresql
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'venue_type') THEN
                  CREATE TYPE venue_type AS ENUM ('DARK', 'LIT');
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'bucket_size') THEN
                  CREATE TYPE bucket_size AS ENUM ('ONE_MINUTE', 'FIVE_MINUTES', 'ONE_HOUR', 'ONE_DAY');
                END IF;
              END
              $$;

