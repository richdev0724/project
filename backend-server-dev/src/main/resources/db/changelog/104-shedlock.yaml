databaseChangeLog:
  - logicalFilePath: src/main/resources/db/changelog/104-shedlock.yaml
  - changeSet:
      id: 104-create-shedlock-table
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: shedlock
      changes:
        - createTable:
            tableName: shedlock
            columns:
              - column:
                  name: name
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_shedlock
                    nullable: false
              - column:
                  name: lock_until
                  type: TIMESTAMP(3)
                  constraints:
                    nullable: false
              - column:
                  name: locked_at
                  type: TIMESTAMP(3)
                  constraints:
                    nullable: false
              - column:
                  name: locked_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
