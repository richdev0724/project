databaseChangeLog:
  - logicalFilePath: db/changelog/134-flow-alerts-retention-30-days.yaml

  - changeSet:
      id: 134-flow-alerts-retention-30-days
      author: marketmono
      comment: Align flow_alerts Timescale retention policy with 30-day Flow sync configuration.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'timescaledb') THEN
                  PERFORM remove_retention_policy('flow_alerts', if_exists => TRUE);
                  PERFORM add_retention_policy('flow_alerts', INTERVAL '30 days', if_not_exists => TRUE);
                END IF;
              END
              $$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DO $$
              BEGIN
                IF EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'timescaledb') THEN
                  PERFORM remove_retention_policy('flow_alerts', if_exists => TRUE);
                  PERFORM add_retention_policy('flow_alerts', INTERVAL '15 days', if_not_exists => TRUE);
                END IF;
              END
              $$;
