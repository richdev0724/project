databaseChangeLog:
  - changeSet:
      id: sector-performance-snapshots-138-table
      author: marketmono
      comment: >-
        Store one performance snapshot per sector ETF for the dashboard
        Sectors widget. Each row holds the live price / previous close /
        daily volume from the upstream stock-state endpoint plus the 30-day
        and 6-month baseline closes resolved once per day from daily OHLC
        history. Rows are replaced in place every minute during market hours
        so user requests never call the upstream market data API.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TABLE IF NOT EXISTS sector_performance_snapshots (
                  id                   BIGSERIAL      PRIMARY KEY,
                  ticker               VARCHAR(10)    NOT NULL,
                  last_price           DECIMAL(18,6),
                  prev_close           DECIMAL(18,6),
                  daily_pct            DOUBLE PRECISION,
                  pct_30d              DOUBLE PRECISION,
                  pct_6m               DOUBLE PRECISION,
                  volume               BIGINT,
                  last_date            DATE,
                  baseline_30d_close   DECIMAL(18,6),
                  baseline_6m_close    DECIMAL(18,6),
                  baseline_date        DATE,
                  fetched_at           TIMESTAMPTZ    NOT NULL,
                  created_at           TIMESTAMPTZ    NOT NULL DEFAULT NOW(),
                  updated_at           TIMESTAMPTZ    NOT NULL DEFAULT NOW(),
                  CONSTRAINT uq_sector_performance_snapshots_ticker UNIQUE (ticker)
              );

              DO $$
              BEGIN
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'marketmono_app') THEN
                  GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.sector_performance_snapshots TO marketmono_app;
                  GRANT USAGE, SELECT ON SEQUENCE public.sector_performance_snapshots_id_seq TO marketmono_app;
                END IF;
              END
              $$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS sector_performance_snapshots;
