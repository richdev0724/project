databaseChangeLog:
  - logicalFilePath: db/changelog/145-runtime-grants-honor-codes.yaml

  - changeSet:
      id: 145-runtime-grants-honor-codes
      author: marketmono
      comment: Grant the runtime app role access to HONOR code records.
      dbms: postgresql
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'marketmono_app')
                     AND to_regclass('public.honor_codes') IS NOT NULL THEN
                      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.honor_codes TO marketmono_app;
                  END IF;
              END
              $$;
      rollback:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'marketmono_app')
                     AND to_regclass('public.honor_codes') IS NOT NULL THEN
                      REVOKE SELECT, INSERT, UPDATE, DELETE ON TABLE public.honor_codes FROM marketmono_app;
                  END IF;
              END
              $$;
