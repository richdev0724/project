databaseChangeLog:
  - logicalFilePath: db/changelog/132-uw-news-headlines.yaml

  - changeSet:
      id: 132-uw-news-headlines
      author: marketmono
      comment: Create stored UW News WebSocket headline table for backend-served news feeds.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TABLE IF NOT EXISTS uw_news_headlines (
                  id                BIGSERIAL PRIMARY KEY,
                  provider_event_id VARCHAR(128),
                  dedupe_key        VARCHAR(256) NOT NULL,
                  created_at        TIMESTAMPTZ  NOT NULL,
                  headline          TEXT         NOT NULL,
                  source            VARCHAR(128),
                  tickers           JSONB        NOT NULL DEFAULT '[]'::jsonb,
                  sentiment         VARCHAR(64),
                  is_major          BOOLEAN      NOT NULL DEFAULT FALSE,
                  tags              JSONB        NOT NULL DEFAULT '[]'::jsonb,
                  meta              JSONB        NOT NULL DEFAULT '{}'::jsonb,
                  description       TEXT,
                  url               TEXT,
                  image_url         TEXT,
                  ingested_at       TIMESTAMPTZ  NOT NULL DEFAULT NOW(),
                  updated_at        TIMESTAMPTZ  NOT NULL DEFAULT NOW(),

                  CONSTRAINT uq_uw_news_headlines_dedupe_key UNIQUE (dedupe_key)
              );

              CREATE INDEX IF NOT EXISTS idx_uw_news_headlines_created_at
                  ON uw_news_headlines (created_at DESC);

              CREATE INDEX IF NOT EXISTS idx_uw_news_headlines_source_created_at
                  ON uw_news_headlines (source, created_at DESC);

              CREATE INDEX IF NOT EXISTS idx_uw_news_headlines_is_major_created_at
                  ON uw_news_headlines (is_major, created_at DESC);

              CREATE INDEX IF NOT EXISTS idx_uw_news_headlines_tickers_gin
                  ON uw_news_headlines USING GIN (tickers);

              DO $$
              BEGIN
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'marketmono_app') THEN
                  GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.uw_news_headlines TO marketmono_app;
                  GRANT USAGE, SELECT ON SEQUENCE public.uw_news_headlines_id_seq TO marketmono_app;
                END IF;
              END
              $$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS uw_news_headlines;
