        - sql:
            splitStatements: false
            dbms: postgresql
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (
                  SELECT 1
                  FROM pg_constraint
                  WHERE conname = 'chk_product_prices_billing_period'
                ) THEN
                  ALTER TABLE product_prices
                    ADD CONSTRAINT chk_product_prices_billing_period
                    CHECK (billing_period IN ('MONTHLY', 'QUARTERLY', 'SEMI_ANNUAL', 'ANNUAL', 'LIFETIME'));
                END IF;
              END
              $$;
        - addUniqueConstraint:
            tableName: product_prices
            columnNames: product_id, billing_period
            constraintName: uk_product_prices_product_billing
        - createIndex:
            indexName: idx_product_prices_product_id
            tableName: product_prices
            columns:
              - column:
                  name: product_id
        - addForeignKeyConstraint:
            baseTableName: product_prices
            baseColumnNames: product_id
            constraintName: fk_product_prices_product
            referencedTableName: products
            referencedColumnNames: id
            onDelete: CASCADE

