        - createTable:
            tableName: product_prices
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: billing_period
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: price_cents
                  type: INT
                  constraints:
