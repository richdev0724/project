databaseChangeLog:
  - logicalFilePath: src/main/resources/db/changelog/003-billing-and-subscriptions.yaml
  - changeSet:
      id: baseline-003-billing-types
      author: marketmono
      comment: Create the payment-related enum types that remain in the consolidated final schema.
      changes:
        - sql:
            splitStatements: false
            dbms: postgresql
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'stripe_mode') THEN
                  CREATE TYPE stripe_mode AS ENUM ('TEST', 'PROD', 'DEFAULT');
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'payment_status') THEN
                  CREATE TYPE payment_status AS ENUM ('PAID', 'FAILED', 'PENDING', 'REFUNDED');
                END IF;
              END
              $$;

  - changeSet:
      id: baseline-003-billing-and-subscriptions
      author: marketmono
      validCheckSum:
        - '9:118175ab2427a2199449a68027edcc91'
      comment: Create the final consolidated billing, Stripe config, catalog, subscriptions, and payment history schema.
      changes:
        - createTable:
            tableName: stripe_config
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: value
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_stripe_config_name
            tableName: stripe_config
            columns:
              - column:
                  name: name
        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO stripe_config (id, name, value)
              VALUES
                (gen_random_uuid(), 'default_mode', 'TEST'),
                (gen_random_uuid(), 'past_due_grace_period_days', '1');

        - createTable:
            tableName: stripe_config_audit_log
            columns:
