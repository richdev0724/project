                    nullable: false
              - column:
                  name: admin_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: field_changed
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: old_value_masked
                  type: VARCHAR(50)
              - column:
                  name: new_value_masked
                  type: VARCHAR(50)
              - column:
                  name: changed_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: ip_address
                  type: VARCHAR(45)
        - createIndex:
            indexName: idx_stripe_config_audit_log_admin_id
            tableName: stripe_config_audit_log
            columns:
              - column:
                  name: admin_id
        - createIndex:
            indexName: idx_stripe_config_audit_log_changed_at
            tableName: stripe_config_audit_log
            columns:
              - column:
                  name: changed_at

        - createTable:
            tableName: products
            columns:
