databaseChangeLog:
  - changeSet:
      id: daily-stock-state-snapshots-142-table
      author: marketmono
      comment: >-
        Store one stock-state snapshot per ticker per trading day, collected
        once at 9:30 AM ET Monday-Friday. Shared by the dashboard Sectors
        widget and the Market Overview / Mag 7 collectors so the upstream
        stock-state endpoint is called once per day per ticker instead of
        every minute. Rows older than the retention window (4 days) are
        purged on each collection cycle.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TABLE IF NOT EXISTS daily_stock_state_snapshots (
                  id             BIGSERIAL      PRIMARY KEY,
                  ticker         VARCHAR(10)    NOT NULL,
                  snapshot_date  DATE           NOT NULL,
                  close          DECIMAL(18,6),
                  prev_close     DECIMAL(18,6),
                  open           DECIMAL(18,6),
                  high           DECIMAL(18,6),
                  low            DECIMAL(18,6),
                  volume         BIGINT,
                  total_volume   BIGINT,
                  tape_time      VARCHAR(40),
                  market_time    VARCHAR(20),
                  fetched_at     TIMESTAMPTZ    NOT NULL,
                  created_at     TIMESTAMPTZ    NOT NULL DEFAULT NOW(),
                  updated_at     TIMESTAMPTZ    NOT NULL DEFAULT NOW(),
                  CONSTRAINT uq_daily_stock_state_snapshots_ticker_date UNIQUE (ticker, snapshot_date)
              );

              DO $$
              BEGIN
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'marketmono_app') THEN
                  GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.daily_stock_state_snapshots TO marketmono_app;
                  GRANT USAGE, SELECT ON SEQUENCE public.daily_stock_state_snapshots_id_seq TO marketmono_app;
                END IF;
              END
              $$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS daily_stock_state_snapshots;
