                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - sql:
            splitStatements: false
            dbms: postgresql
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (
                  SELECT 1
                  FROM pg_constraint
                  WHERE conname = 'chk_option_contracts_type'
                ) THEN
                  ALTER TABLE option_contracts
                    ADD CONSTRAINT chk_option_contracts_type
                    CHECK (contract_type IN ('CALL', 'PUT'));
                END IF;
              END
              $$;
