databaseChangeLog:
  - logicalFilePath: src/main/resources/db/changelog/001-market-reference-and-cache.yaml
  - changeSet:
      id: baseline-001-market-reference-types
      author: marketmono
      validCheckSum:
        - '9:82dce51a9a11504db9c84abba3eef41d'
      comment: Create shared enums used by market cache, politician, and economic event tables.
      changes:
        - sql:
            splitStatements: false
            dbms: postgresql
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'option_type_enum') THEN
                  CREATE TYPE option_type_enum AS ENUM ('CALL', 'PUT');
                END IF;
                                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'data_source_enum') THEN
                                    CREATE TYPE data_source_enum AS ENUM ('WEBSOCKET', 'REST');
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'economic_event_type') THEN
                  CREATE TYPE economic_event_type AS ENUM ('FED_SPEAKER', 'FOMC', 'REPORT', 'SEC_13F', 'INDEX_REBALANCE', 'INDEX_REBALANCE_ANNOUNCEMENT');
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'economic_event_priority') THEN
                  CREATE TYPE economic_event_priority AS ENUM ('HIGH', 'MEDIUM', 'LOW');
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'transaction_type') THEN
                  CREATE TYPE transaction_type AS ENUM ('BUY', 'SELL', 'EXCHANGE');
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'issuer_type') THEN
                  CREATE TYPE issuer_type AS ENUM ('SELF', 'SPOUSE', 'CHILD', 'JOINT', 'UNDISCLOSED');
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'member_type') THEN
                  CREATE TYPE member_type AS ENUM ('HOUSE', 'SENATE');
                END IF;
              END
              $$;

  - changeSet:
