                  constraints:
                    nullable: false
              - column:
                  name: expiration_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: contract_type
                  type: VARCHAR(4)
                  constraints:
                    nullable: false
              - column:
                  name: last_price
                  type: DECIMAL(12,4)
              - column:
                  name: bid_price
                  type: DECIMAL(12,4)
              - column:
                  name: ask_price
                  type: DECIMAL(12,4)
              - column:
                  name: volume
                  type: INTEGER
              - column:
                  name: open_interest
                  type: INTEGER
              - column:
                  name: implied_volatility
